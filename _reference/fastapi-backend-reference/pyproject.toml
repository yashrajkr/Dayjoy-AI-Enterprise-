[project]
name = "dayjoyai-backend"
version = "0.1.0"
description = "Dayjoy AI Platform — Backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dayjoy AI", email = "engineering@dayjoyai.com" },
]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Validation & config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    # Cache
    "redis>=5.0.8",
    # Auth
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",  # Explicit — needed for Fernet encryption (OAuth, connectors, webhooks)
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    # Logging
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    # HTTP client (for external APIs)
    "httpx>=0.27.0",

    # LLM Providers
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    # Groq uses the openai SDK (OpenAI-compatible API)
    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pre-commit>=3.8.0",
    "types-python-jose",
    "aiosqlite>=0.22.1",
]
# RAG / Knowledge Management optional dependencies
# Install with: pip install -e ".[rag]"
rag = [
    # Vector database (Qdrant)
    "qdrant-client>=1.10.0",
    # Document processors (binary formats)
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Local embedding provider (BGE)
    "sentence-transformers>=3.0.0",
]
# Production RAG = rag + production essentials
rag-prod = [
    "qdrant-client>=1.10.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ===== Ruff (lint + format) =====
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # use of assert (needed for tests)
    "S104",   # possible binding to all interfaces (needed for 0.0.0.0)
    "B008",   # do not perform function call in argument defaults (FastAPI Depends)
    "UP046",  # Generic class style — keep Generic[ModelT] for compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests
"alembic/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ===== mypy (type checking) =====
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

# ===== pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-config=.coveragerc",
]
testpaths = ["app/tests", "tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests (with DB/services)",
    "slow: slow tests (skip in CI fast path)",
]

# ===== Coverage =====
[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
