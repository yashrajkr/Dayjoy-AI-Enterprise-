# Alertmanager configuration for Dayjoy AI Platform.
#
# Alerts are routed by severity to dedicated Slack channels. Critical alerts
# page immediately; warnings are batched and repeated every 4 hours. All
# notifications include send_resolved so on-call gets closure messages too.
#
# Replace `slack_api_url` (and the channel names below) with real Slack
# webhook + channels before deploying to production.

global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/REPLACE_ME'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'slack-critical'
  routes:
    - match: { severity: critical }
      receiver: 'slack-critical'
    - match: { severity: warning }
      receiver: 'slack-warning'

receivers:
  - name: 'slack-critical'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
  - name: 'slack-warning'
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
