# CodeQL semantic code analysis for the Dayjoy AI Platform.
#
# Runs GitHub's CodeQL on every push to / PR against `main`, analysing the
# TypeScript + JavaScript surface (backend NestJS app, frontend dashboards,
# shared libraries). Findings appear under Security → Code Scanning alerts and
# are surfaced inline on PRs as code-review annotations.
name: 'CodeQL'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC sweep

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['typescript', 'javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the default + extended security-extended query suites for
          # deeper coverage on TS/JS, including framework-aware queries.
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
