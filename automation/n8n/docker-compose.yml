# =============================================================================
# Dayjoy AI Enterprise — n8n Docker Compose
# =============================================================================
# Production deployment of n8n with PostgreSQL backend, Redis (queue mode),
# Caddy reverse proxy (TLS termination), Prometheus + Pushgateway + Grafana.
#
# Usage:
#   1. cp .env.example .env  && edit values
#   2. docker network create dayjoy-network  (one-time)
#   3. docker compose --env-file .env up -d
#   4. Browse https://n8n.dayjoy.ai
#
# All ${VARS} are substituted from .env at compose-up time.
# =============================================================================

version: '3.9'

networks:
  dayjoy-network:
    external: true
    name: dayjoy-network

volumes:
  n8n_data:
    name: dayjoy-n8n-data
  n8n_postgres_data:
    name: dayjoy-n8n-postgres-data
  n8n_redis_data:
    name: dayjoy-n8n-redis-data
  caddy_data:
    name: dayjoy-n8n-caddy-data
  caddy_config:
    name: dayjoy-n8n-caddy-config
  prometheus_data:
    name: dayjoy-n8n-prometheus-data
  grafana_data:
    name: dayjoy-n8n-grafana-data

services:
  # ---------------------------------------------------------------------------
  # n8n main instance (queue mode: main + workers)
  # ---------------------------------------------------------------------------
  n8n-main:
    image: n8nio/n8n:latest
    container_name: dayjoy-n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- n8n core ---
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=true
      - N8N_TEMPLATES_ENABLED=false

      # --- Database (PostgreSQL) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=dayjoy_n8n
      - DB_POSTGRESDB_USER=dayjoy
      - DB_POSTGRESDB_PASSWORD=${DATABASE_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public

      # --- Queue mode (Redis + workers) ---
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_HEALTH_CHECK_ACTIVE=true

      # --- Auth (basic, in front of n8n UI/API) ---
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD}

      # --- Execution data lifecycle ---
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336         # 14 days (in hours)
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

      # --- Metrics ---
      - N8N_METRICS=true
      - N8N_METRICS_PREFIX=dayjoy_n8n_

      # --- Logging ---
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console

      # --- External env passthrough (used by workflows via $env) ---
      - DAYJOY_API_URL=${DAYJOY_API_URL}
      - DAYJOY_API_TOKEN=${DAYJOY_API_TOKEN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY}
      - PROMETHEUS_PUSHGATEWAY_URL=${PROMETHEUS_PUSHGATEWAY_URL}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}

      # --- n8n main role flag ---
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # n8n worker (queue mode — pulls executions from Redis)
  # ---------------------------------------------------------------------------
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: dayjoy-n8n-worker
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      # Same env block as n8n-main (workers share DB/Redis config)
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=dayjoy_n8n
      - DB_POSTGRESDB_USER=dayjoy
      - DB_POSTGRESDB_PASSWORD=${DATABASE_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_METRICS=true
      - N8N_METRICS_PREFIX=dayjoy_n8n_worker_
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - DAYJOY_API_URL=${DAYJOY_API_URL}
      - DAYJOY_API_TOKEN=${DAYJOY_API_TOKEN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY}
      - PROMETHEUS_PUSHGATEWAY_URL=${PROMETHEUS_PUSHGATEWAY_URL}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - n8n_data:/home/node/.n8n:ro
    depends_on:
      n8n-main:
        condition: service_healthy
    networks:
      - dayjoy-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # PostgreSQL — n8n internal DB (executions, credentials, workflow state)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: dayjoy-n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dayjoy
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=dayjoy_n8n
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayjoy -d dayjoy_n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis — n8n queue + caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dayjoy-n8n-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - n8n_redis_data:/data
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Caddy — TLS-terminating reverse proxy in front of n8n
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: dayjoy-n8n-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_ADMIN_USER=${N8N_ADMIN_USER}
      - N8N_ADMIN_PASSWORD=${N8N_ADMIN_PASSWORD}
    depends_on:
      - n8n-main
    networks:
      - dayjoy-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes n8n /metrics + pushgateway
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: dayjoy-n8n-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks:
      - dayjoy-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Prometheus Pushgateway — for n8n workflows that push gauges
  # ---------------------------------------------------------------------------
  prometheus-pushgateway:
    image: prom/pushgateway:latest
    container_name: dayjoy-n8n-pushgateway
    restart: unless-stopped
    networks:
      - dayjoy-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Grafana — dashboards for n8n + Dayjoy platform
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: dayjoy-n8n-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://n8n.dayjoy.ai/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - dayjoy-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
