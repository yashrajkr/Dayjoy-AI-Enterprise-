# =============================================================================
# Dayjoy n8n — ExternalSecret
# Syncs secrets from AWS Secrets Manager → Kubernetes Secret objects.
# Requires the ExternalSecrets Operator (ESO) to be installed.
# =============================================================================

# --- ExternalSecret for n8n's main config (non-encryption secrets) ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: dayjoy-n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: dayjoy-ai-enterprise
spec:
  refreshInterval: 1h  # re-sync from AWS SM every hour
  secretStoreRef:
    name: aws-secretsmanager-dayjoy  # SecretStore defined below
    kind: ClusterSecretStore
  target:
    name: n8n-secrets  # the resulting Kubernetes Secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        N8N_ADMIN_USER: "{{ .n8nAdminUser }}"
        N8N_ADMIN_PASSWORD: "{{ .n8nAdminPassword }}"
        DAYJOY_API_TOKEN: "{{ .dayjoyApiToken }}"
        SLACK_WEBHOOK_URL: "{{ .slackWebhookUrl }}"
        PAGERDUTY_INTEGRATION_KEY: "{{ .pagerdutyIntegrationKey }}"
        WHATSAPP_PHONE_NUMBER_ID: "{{ .whatsappPhoneNumberId }}"
        WHATSAPP_ACCESS_TOKEN: "{{ .whatsappAccessToken }}"
        WHATSAPP_WEBHOOK_VERIFY_TOKEN: "{{ .whatsappWebhookVerifyToken }}"
        SMTP_PASSWORD: "{{ .smtpPassword }}"
        GOOGLE_CLIENT_ID: "{{ .googleClientId }}"
        GOOGLE_CLIENT_SECRET: "{{ .googleClientSecret }}"
        BLAND_API_KEY: "{{ .blandApiKey }}"
        VAPI_API_KEY: "{{ .vapiApiKey }}"
        RETELL_API_KEY: "{{ .retellApiKey }}"
        RAZORPAY_KEY_ID: "{{ .razorpayKeyId }}"
        RAZORPAY_KEY_SECRET: "{{ .razorpayKeySecret }}"
        RAZORPAY_WEBHOOK_SECRET: "{{ .razorpayWebhookSecret }}"
        GRAFANA_ADMIN_USER: "{{ .grafanaAdminUser }}"
        GRAFANA_ADMIN_PASSWORD: "{{ .grafanaAdminPassword }}"
  data:
    # Each entry maps a key in the AWS Secrets Manager secret to a template var
    - secretKey: n8nAdminUser
      remoteRef:
        key: dayjoy/n8n/production  # AWS SM secret name
        property: n8n_admin_user
    - secretKey: n8nAdminPassword
      remoteRef:
        key: dayjoy/n8n/production
        property: n8n_admin_password
    - secretKey: dayjoyApiToken
      remoteRef:
        key: dayjoy/n8n/production
        property: dayjoy_api_token
    - secretKey: slackWebhookUrl
      remoteRef:
        key: dayjoy/n8n/production
        property: slack_webhook_url
    - secretKey: pagerdutyIntegrationKey
      remoteRef:
        key: dayjoy/n8n/production
        property: pagerduty_integration_key
    - secretKey: whatsappPhoneNumberId
      remoteRef:
        key: dayjoy/n8n/production
        property: whatsapp_phone_number_id
    - secretKey: whatsappAccessToken
      remoteRef:
        key: dayjoy/n8n/production
        property: whatsapp_access_token
    - secretKey: whatsappWebhookVerifyToken
      remoteRef:
        key: dayjoy/n8n/production
        property: whatsapp_webhook_verify_token
    - secretKey: smtpPassword
      remoteRef:
        key: dayjoy/n8n/production
        property: smtp_password
    - secretKey: googleClientId
      remoteRef:
        key: dayjoy/n8n/production
        property: google_client_id
    - secretKey: googleClientSecret
      remoteRef:
        key: dayjoy/n8n/production
        property: google_client_secret
    - secretKey: blandApiKey
      remoteRef:
        key: dayjoy/n8n/production
        property: bland_api_key
    - secretKey: vapiApiKey
      remoteRef:
        key: dayjoy/n8n/production
        property: vapi_api_key
    - secretKey: retellApiKey
      remoteRef:
        key: dayjoy/n8n/production
        property: retell_api_key
    - secretKey: razorpayKeyId
      remoteRef:
        key: dayjoy/n8n/production
        property: razorpay_key_id
    - secretKey: razorpayKeySecret
      remoteRef:
        key: dayjoy/n8n/production
        property: razorpay_key_secret
    - secretKey: razorpayWebhookSecret
      remoteRef:
        key: dayjoy/n8n/production
        property: razorpay_webhook_secret
    - secretKey: grafanaAdminUser
      remoteRef:
        key: dayjoy/n8n/production
        property: grafana_admin_user
    - secretKey: grafanaAdminPassword
      remoteRef:
        key: dayjoy/n8n/production
        property: grafana_admin_password
---
# --- ExternalSecret for the n8n encryption key (kept in its own SM secret for tighter IAM) ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-encryption-key-sync
  namespace: dayjoy-n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: dayjoy-ai-enterprise
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-dayjoy
    kind: ClusterSecretStore
  target:
    name: n8n-encryption-key  # consumed by the Deployment
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        encryption-key: "{{ .encryptionKey }}"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: dayjoy/n8n/encryption-key  # separate AWS SM secret
        property: encryption_key
---
# --- ClusterSecretStore (AWS Secrets Manager backend) ---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager-dayjoy
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: dayjoy-ai-enterprise
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
