# Dayjoy AI Enterprise — Nginx reverse proxy
# Routes:
#   /              → admin-dashboard:3000
#   /api           → backend:3000
#   /api/voice     → voice-ai:3001
#   /api/whatsapp  → whatsapp-ai:3002

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:3000;
  }
  upstream voice_ai {
    server voice-ai:3001;
  }
  upstream whatsapp_ai {
    server whatsapp-ai:3002;
  }
  upstream admin_dashboard {
    server admin-dashboard:3000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # API routes
    location /api/voice/ {
      proxy_pass http://voice_ai;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/whatsapp/ {
      proxy_pass http://whatsapp_ai;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Frontend
    location / {
      proxy_pass http://admin_dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
