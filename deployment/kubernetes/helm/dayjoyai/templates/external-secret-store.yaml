{{/*
SecretStore + ExternalSecrets for Dayjoy AI.

This template materializes:
  1. A SecretStore backed by AWS Secrets Manager (IRSA via the
     dayjoy-external-secrets ServiceAccount).
  2. An ExternalSecret that creates the Kubernetes Secret named
     "dayjoy-db-secret" consumed by the Bitnami postgresql subchart
     (auth.existingSecret in values.yaml).
  3. An ExternalSecret that creates the Kubernetes Secret named
     "dayjoy-grafana-secret" consumed by the Grafana Helm chart
     (adminExistingSecret in values.yaml).

The backend application secrets (SECRET_KEY, OPENAI_API_KEY, etc.) are
materialized by the ExternalSecret defined in templates/backend.yaml and
share the same SecretStore.
*/}}
{{- if .Values.backend.externalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dayjoy-external-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dayjoyai.labels" . | nindent 4 }}
  annotations:
    # Replace ACCOUNT_ID with the real AWS account ID at install time
    # (e.g. via --set global.aws.roleArn=arn:aws:iam::123456789012:role/dayjoy-external-secrets)
    eks.amazonaws.com/role-arn: {{ .Values.global.aws.roleArn | default "arn:aws:iam::ACCOUNT_ID:role/dayjoy-external-secrets" | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.backend.externalSecret.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dayjoyai.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.aws.region | default "ap-south-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: dayjoy-external-secrets
---
# Database password for the Bitnami postgresql subchart.
# The subchart expects the Secret to contain a key named "password".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dayjoy-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dayjoyai.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.backend.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: dayjoy-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: dayjoy/prod/database-password
---
# Grafana admin password. The Grafana Helm chart consumes the key
# "admin-password" from the Secret referenced by adminExistingSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dayjoy-grafana-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dayjoyai.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.backend.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: dayjoy-grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: dayjoy/prod/grafana-admin-password
{{- end }}
