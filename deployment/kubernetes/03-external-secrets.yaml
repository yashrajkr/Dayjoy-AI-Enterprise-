apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: dayjoy
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: dayjoy-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dayjoy-external-secrets
  namespace: dayjoy
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dayjoy-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dayjoy-secrets
  namespace: dayjoy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: dayjoy-secrets
    creationPolicy: Owner
  data:
    - { secretKey: SECRET_KEY,         remoteRef: { key: dayjoy/prod/app,       property: secret_key } }
    - { secretKey: DATABASE_URL,       remoteRef: { key: dayjoy/prod/database,  property: url } }
    - { secretKey: JWT_SECRET,         remoteRef: { key: dayjoy/prod/auth,      property: jwt_secret } }
    - { secretKey: REDIS_URL,          remoteRef: { key: dayjoy/prod/database,  property: redis_url } }
    - { secretKey: VAPI_API_KEY,       remoteRef: { key: dayjoy/prod/voice,     property: vapi_api_key } }
    - { secretKey: VAPI_WEBHOOK_SECRET,remoteRef: { key: dayjoy/prod/voice,     property: vapi_webhook_secret } }
    - { secretKey: OPENAI_API_KEY,     remoteRef: { key: dayjoy/prod/ai,        property: openai_api_key } }
    - { secretKey: WHATSAPP_TOKEN,     remoteRef: { key: dayjoy/prod/whatsapp,  property: token } }
    - { secretKey: TWILIO_AUTH_TOKEN,  remoteRef: { key: dayjoy/prod/telephony, property: auth_token } }
