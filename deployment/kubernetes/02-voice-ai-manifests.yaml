# Dayjoy Voice AI - Kubernetes Manifests
# Production-ready K8s deployment configuration

# ============================================
# Namespace
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: dayjoy-voice-ai
  labels:
    app: voice-ai
    environment: production

---
# ============================================
# ConfigMap
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-ai-config
  namespace: dayjoy-voice-ai
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DATABASE_POOL_SIZE: "20"
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

---
# ============================================
# ExternalSecret — fetches sensitive values into a K8s Secret from AWS
# Secrets Manager via the External Secrets Operator. NEVER store plaintext
# secrets in Git. Mirrors the pattern in 03-external-secrets.yaml.
# ============================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voice-ai-secret
  namespace: dayjoy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: voice-ai-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dayjoy/prod/database, property: url }
    - secretKey: VAPI_API_KEY
      remoteRef: { key: dayjoy/prod/voice, property: vapi_api_key }
    - secretKey: VAPI_WEBHOOK_SECRET
      remoteRef: { key: dayjoy/prod/voice, property: vapi_webhook_secret }
    - secretKey: JWT_SECRET
      remoteRef: { key: dayjoy/prod/auth, property: jwt_secret }
    - secretKey: REDIS_URL
      remoteRef: { key: dayjoy/prod/database, property: redis_url }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: dayjoy/prod/ai, property: openai_api_key }

---
# ============================================
# Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-ai
  namespace: dayjoy-voice-ai
  labels:
    app: voice-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voice-ai
  template:
    metadata:
      labels:
        app: voice-ai
    spec:
      containers:
      - name: voice-ai
        image: dayjoy/voice-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: voice-ai-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: voice-ai-secret
              key: DATABASE_URL
        - name: VAPI_API_KEY
          valueFrom:
            secretKeyRef:
              name: voice-ai-secret
              key: VAPI_API_KEY
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: voice-ai
              topologyKey: kubernetes.io/hostname

---
# ============================================
# Service
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: voice-ai-service
  namespace: dayjoy-voice-ai
  labels:
    app: voice-ai
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: voice-ai

---
# ============================================
# Ingress
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-ai-ingress
  namespace: dayjoy-voice-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - voice-ai.dayjoy.com
    secretName: voice-ai-tls
  rules:
  - host: voice-ai.dayjoy.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voice-ai-service
            port:
              number: 3000

---
# ============================================
# HorizontalPodAutoscaler
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-ai-hpa
  namespace: dayjoy-voice-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-ai
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# ============================================
# ServiceMonitor (Prometheus)
# ============================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: voice-ai-monitor
  namespace: dayjoy-voice-ai
  labels:
    app: voice-ai
spec:
  selector:
    matchLabels:
      app: voice-ai
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - dayjoy-voice-ai

---
# ============================================
# PodDisruptionBudget
# ============================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voice-ai-pdb
  namespace: dayjoy-voice-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: voice-ai

---
# ============================================
# NetworkPolicy
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-ai-network-policy
  namespace: dayjoy-voice-ai
spec:
  podSelector:
    matchLabels:
      app: voice-ai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379