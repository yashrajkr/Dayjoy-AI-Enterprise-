# =====================================================
# Dayjoy AI Enterprise — Root docker-compose
# Development environment for the whole stack
# =====================================================
# Usage:
#   docker compose up -d                    # start everything
#   docker compose up postgres redis        # start only infra
#   docker compose logs -f backend          # tail backend logs
#   docker compose down -v                  # stop + delete volumes
#   docker compose up --pull always         # pull latest images before starting

version: "3.9"

# Shared network for service discovery
networks:
  dayjoy-network:
    driver: bridge

services:
  # ===== INFRASTRUCTURE =====

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dayjoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dayjoy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dayjoy}
      POSTGRES_DB: ${DB_NAME:-dayjoy_ai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dayjoy} -d ${DB_NAME:-dayjoy_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: dayjoy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== BACKEND SERVICES =====

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: dayjoy-ai-backend:latest
    container_name: dayjoy-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-dayjoy}:${DB_PASSWORD:-dayjoy}@postgres:5432/${DB_NAME:-dayjoy_ai}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=debug
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dayjoy-network
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - ./shared:/app/shared
      - ./database:/app/database
      - /app/node_modules
      - /app/backend/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=backend"

  # Voice AI (Vapi)
  voice-ai:
    build:
      context: .
      dockerfile: ./vapi/Dockerfile
    image: dayjoy-ai-voice:latest
    container_name: dayjoy-voice-ai
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-dayjoy}:${DB_PASSWORD:-dayjoy}@postgres:5432/${DB_NAME:-dayjoy_ai}
      - REDIS_URL=redis://redis:6379/1
      - LOG_LEVEL=debug
    ports:
      - "${VAPI_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dayjoy-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=voice-ai"

  # Note: WhatsApp AI is a NestJS module bundled into the backend service.
  # It is NOT a standalone microservice. Routes are served by backend on port 3000.

  # ===== FRONTEND SERVICES =====

  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
    image: dayjoy-admin-dashboard:latest
    container_name: dayjoy-admin
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3000
      - NEXT_PUBLIC_ENABLE_DEBUG=true
    ports:
      - "${ADMIN_DASHBOARD_PORT:-3003}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dayjoy-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=admin-dashboard"

  # ===== DATA & STORAGE =====

  minio:
    image: minio/minio:latest
    container_name: dayjoy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dayjoy}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dayjoy123}
      MINIO_DOMAIN: localhost
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - dayjoy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Automation (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: dayjoy-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dayjoy-n8n-dev-key}
      N8N_DB_TYPE: postgresdb
      N8N_DB_POSTGRESDB_HOST: postgres
      N8N_DB_POSTGRESDB_PORT: 5432
      N8N_DB_POSTGRESDB_DATABASE: ${DB_NAME:-dayjoy_ai}
      N8N_DB_POSTGRESDB_USER: ${DB_USER:-dayjoy}
      N8N_DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-dayjoy}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dayjoy-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vector DB (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dayjoy-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dayjoy-network
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== MONITORING & OBSERVABILITY =====

  prometheus:
    image: prom/prometheus:latest
    container_name: dayjoy-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - dayjoy-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: dayjoy-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_LOG_LEVEL=info
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - dayjoy-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    container_name: dayjoy-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - dayjoy-network
    command: -config.file=/etc/loki/loki-config.yml
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== REVERSE PROXY =====

  nginx:
    image: nginx:alpine
    container_name: dayjoy-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dayjoy-network
    depends_on:
      backend:
        condition: service_healthy
      admin-dashboard:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  minio_data:
    driver: local
  n8n_data:
    driver: local
  qdrant_data:
    driver: local
