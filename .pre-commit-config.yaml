# Pre-commit hooks for Dayjoy AI Enterprise (TypeScript/NestJS)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ts, tsx, js, jsx, json, css, md, yaml]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd "$PWD" && pnpm -r lint'
        language: system
        types: [ts]
        pass_filenames: false
